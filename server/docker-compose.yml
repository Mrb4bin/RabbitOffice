# docker compose -f server/docker-compose.yml up -d   (run from the project root)
# First start prints the admin password: docker compose -f server/docker-compose.yml logs
# For automatic HTTPS set a domain: docker compose exec rabbit-office node server/bin/rabbit-office.js config set domain office.example.com
services:
  rabbit-office:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
    volumes:
      - rabbit-data:/data
volumes:
  rabbit-data:
